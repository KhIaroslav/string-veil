name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance to mint a signed provenance attestation.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates the signing/publishing steps behind a manually approved environment.
    # Configure required reviewers under: Settings -> Environments -> release.
    # The signing and Central/Plugin Portal secrets should be attached to this
    # environment so they are never exposed to workflows outside the release path.
    environment: release
    env:
      NDK_VERSION: 27.3.13750724

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release tag
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [[ -z "$version" || "$version" == *SNAPSHOT* ]]; then
            echo "VERSION_NAME must contain a non-SNAPSHOT release version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version."
            exit 1
          fi

      - name: Check publication secrets
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          required=(
            CENTRAL_PORTAL_USERNAME
            CENTRAL_PORTAL_PASSWORD
            SIGNING_KEY
            SIGNING_PASSWORD
            GRADLE_PUBLISH_KEY
            GRADLE_PUBLISH_SECRET
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required GitHub Actions secret: $variable"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # Verify gradle-wrapper.jar against Gradle's published checksums before it runs.
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "STRING_VEIL_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Test release
        run: >-
          ./gradlew
          clean
          test
          :native-differential:nativeDifferentialTest
          :native-runtime:assembleRelease
          :gradle-plugin:validatePlugins
          --stacktrace
          --no-daemon

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: string-veil-sbom.spdx.json
          upload-artifact: false

      - name: Publish artifacts to Maven Central
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal --stacktrace --no-daemon

      - name: Publish Gradle plugin
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins --stacktrace --no-daemon

      # Signed SLSA provenance for the published binaries. Because the archives are reproducible,
      # these digests match what a consumer can rebuild and re-hash. Verify with:
      #   gh attestation verify <artifact> --repo KhIaroslav/string-veil
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            **/build/libs/*.jar
            native-runtime/build/outputs/aar/*.aar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" string-veil-sbom.spdx.json --clobber
