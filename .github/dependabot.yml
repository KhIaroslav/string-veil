version: 2
updates:
  # Keep GitHub Actions up to date; workflow references remain pinned to reviewed commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Gradle dependencies and the version catalog (gradle/libs.versions.toml).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
