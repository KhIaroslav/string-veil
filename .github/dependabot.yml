version: 2
updates:
  # Keep GitHub Actions up to date (and enable moving to SHA-pinned actions later).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Gradle dependencies and the version catalog (gradle/libs.versions.toml).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
    # Kotlin is intentionally pinned: the compiler plugin binds to internal K2 IR APIs, so Kotlin
    # upgrades must be validated by a human, not merged automatically.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
