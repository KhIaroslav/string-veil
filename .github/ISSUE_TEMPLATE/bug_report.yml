name: Bug report
description: Report incorrect behavior in String Veil
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please **do not** report security
        vulnerabilities here — follow the private process in
        [SECURITY.md](https://github.com/khstov/string-veil/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction (ideally a small annotated snippet or a repo link).
      placeholder: |
        1. Annotate `val x = "..."` with `@Obfuscate`
        2. Build with `./gradlew ...`
        3. Observe ...
    validations:
      required: true
  - type: input
    id: string-veil-version
    attributes:
      label: String Veil version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: kotlin-version
    attributes:
      label: Kotlin version
      placeholder: "1.9.24"
    validations:
      required: true
  - type: input
    id: gradle-version
    attributes:
      label: Gradle version
      placeholder: "8.14.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - Kotlin/JVM
        - Java/JVM
        - Kotlin/Android
        - Java/Android
        - Multiple platforms
    validations:
      required: true
  - type: input
    id: android-details
    attributes:
      label: Android details (if applicable)
      description: AGP version, compileSdk, minSdk, build type, and ABI.
      placeholder: "AGP 8.7.3, compileSdk 34, minSdk 21, release, arm64-v8a"
  - type: textarea
    id: logs
    attributes:
      label: Build/runtime logs
      description: Relevant stacktrace or output. Please scrub anything sensitive.
      render: text
