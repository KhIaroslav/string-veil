name: Feature request
description: Suggest an enhancement for String Veil
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind String Veil's scope: it is a **build-time string obfuscator**, not an
        encryption or secrets-management tool. Requests to make it a secure secret store are out of
        scope — see [SECURITY.md](https://github.com/khstov/string-veil/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — links, prior art, use cases.
